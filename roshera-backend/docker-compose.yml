version: '3.8'

services:
  api-server:
    build:
      # Repo root: the image compiles in roshera-agent-policy.md from there
      # (Dockerfile.dockerignore next to the Dockerfile limits what is sent).
      context: ..
      dockerfile: roshera-backend/Dockerfile
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      - RUST_LOG=info
      - SERVER_HOST=0.0.0.0
    volumes:
      - ./exports:/app/exports
    networks:
      - roshera-network

networks:
  roshera-network:
    driver: bridge
