# cargo-nextest configuration.
#
# slow-timeout is a backstop: any test still running after 5 min (60s warn ×
# terminate-after 5) is terminated and reported, so a hang can never burn the
# whole CI job. It was added when timeline-engine's tests intermittently
# deadlocked (a `Timeline::create_branch` DashMap shard self-deadlock — now
# fixed); it stays as cheap insurance against any future hang. 5 min is far
# above the slowest legitimate single test.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# torus_boolean_is_deterministic is the #37 determinism gate: it deliberately
# re-runs the torus/rim-poke boolean 5× for EACH of 3 ops (15 dense curved
# welds + 15 manifold reports in one process) and fingerprints every run —
# repetition IS the assertion, so neither the run count nor the fixture can
# shrink without weakening the gate (the cell historically returned three
# different volumes from order-dependent welding). A green CI run measured
# 289.9 s — 10 s under the 5-min backstop — and a slower runner tipped it
# over once. Give this single test a 10-min leash (120 s warn × 5) instead
# of weakening the determinism assertion or the fixture.
[[profile.default.overrides]]
filter = 'test(torus_boolean_is_deterministic)'
slow-timeout = { period = "120s", terminate-after = 5 }

# #35 / #7 curved-boolean ACCEPTANCE tests: each builds the cross-bore or
# sphere-bite solid and then checks its volume against a dense-mesh oracle,
# which at opt-level 0 is minutes of honest work, not a hang. Measured
# locally 2026-11-05 (debug, no debuginfo): diff_intersecting_unequal_bores_35
# 312 s; diff_skew_perp_bores_35 + unequal_bores_near_tangent_35 1056 s run
# as a pair; diff_cyl_offaxis_sphere_bite_seam_7 569 s. All PASS. Under the
# 5-min backstop all four were killed on their first full CI run. A 25-min
# leash (300 s warn x 5) runs them without weakening the oracle bars; the
# 5-min backstop still applies to everything else. On CI they run in the
# fortnightly full suite, not on every push (see [profile.ci] below).
[[profile.default.overrides]]
filter = 'test(diff_intersecting_unequal_bores_35) | test(diff_skew_perp_bores_35) | test(unequal_bores_near_tangent_35) | test(diff_cyl_offaxis_sphere_bite_seam_7)'
slow-timeout = { period = "300s", terminate-after = 5 }

# Per-push CI profile (`cargo nextest run --profile ci`, used by ci.yml):
# everything EXCEPT the heavy tests below, which run in the FORTNIGHTLY full
# suite (.github/workflows/full-test-suite.yml, default profile, every test).
# Varun 2026-11-05: heavy kernel tests run fortnightly, not on every push.
#
# The list is every test that took >= 120 s in the first complete CI run
# (7ce295a4, 2026-11-05; 8778/8778 passed, nextest 49 min). Tests run in
# parallel, so the per-push wall time is set by the slowest single test: the
# four bore/sphere booleans alone took 10-16 min each. Trade-off, stated
# plainly: a regression in one of these is caught up to two weeks late, or
# sooner by running the full-suite workflow by hand (workflow_dispatch).
#
# Locally nothing changes: `cargo test` and the default nextest profile run
# every test. Adding a test here is a decision to test it less often — note
# its measured CI time beside it.
[profile.ci]
default-filter = '''
not (
    test(=operations::boolean::tests::diff_skew_perp_bores_35)
  | test(=operations::boolean::tests::diff_intersecting_unequal_bores_35)
  | test(=operations::boolean::tests::unequal_bores_near_tangent_35)
  | test(=diff_cyl_offaxis_sphere_bite_seam_7)
  | test(=signed_area_2d_matches_exact_rational_oracle_on_adversarial_inputs)
  | test(=orient3d_matches_exact_rational_oracle_on_adversarial_inputs)
  | test(=insphere_matches_exact_rational_oracle_on_adversarial_inputs)
  | test(=orient2d_matches_exact_rational_oracle_on_adversarial_inputs)
  | test(=audio_processor_advanced::tests::test_noise_isolation)
  | test(=curved_boolean_on_rotated_primitive_terminates)
  | test(=replay::tests::mould_drill_diameter_rederives_downstream_and_preserves_references)
  | test(=diff_box_boss_offaxis_sphere_7)
  | test(=broaden_loft_varied_sections)
)
'''
# Measured CI times (s), same order: 984 862 820 582 267 255 193 143 191 179
# 160 132 126.
